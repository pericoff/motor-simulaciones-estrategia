name: Pruebas del motor
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: |
          node --check app.js
          node --check scenarios.js
          node --check engine.js
          node --check review-content.js
          node --check review-ui.js
          node --check review-solo.js
          node --check video-config.js
          node --check video-ui.js
